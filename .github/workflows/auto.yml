name: Auto Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Compile
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          git checkout -- arch/arm64/configs/exynos7885-a10_defconfig || true
          make O=out CC=clang-12 HOSTCFLAGS="-fcommon" exynos7885-a10_defconfig
          ./scripts/config --file out/.config -e CONFIG_USB_SUPPORT -e CONFIG_USB -e CONFIG_USB_NET_DRIVERS -e CONFIG_WLAN -e CONFIG_CFG80211 -e CONFIG_MAC80211 -e CONFIG_RTL8XXXU -e CONFIG_RTL8XXXU_UNTESTED
          make O=out CC=clang-12 HOSTCFLAGS="-fcommon" olddefconfig
          make -j$(nproc --all) O=out CC=clang-12 LD=ld.lld-12 HOSTCFLAGS="-fcommon" KCFLAGS="-w -Wno-error" Image
      - name: Package Zip
        run: |
          mkdir -p zip_out
          cp out/arch/arm64/boot/Image* zip_out/
          cd zip_out && zip -r9 ../Neternels-A10-WiFi.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: Neternels-A10-WiFi
          path: Neternels-A10-WiFi.zip
