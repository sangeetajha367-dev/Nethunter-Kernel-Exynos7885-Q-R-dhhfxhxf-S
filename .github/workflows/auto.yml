name: Auto Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev wget
          mkdir -p toolchain && cd toolchain
          wget -q https://github.com
          tar -xf Clang-18.0.0-20240113.tar.gz && rm -f Clang-18.0.0-20240113.tar.gz
          cd ..
          git clone --depth=1 https://github.com drivers/net/wireless/rtl8188fu
          echo 'obj-$(CONFIG_RTL8188FU) += rtl8188fu/' >> drivers/net/wireless/Makefile
          sed -i '/endif/i source "drivers/net/wireless/rtl8188fu/Kconfig"' drivers/net/wireless/Kconfig
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' drivers/net/wireless/rtl8188fu/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_RPI = n/CONFIG_PLATFORM_ARM_RPI = y/g' drivers/net/wireless/rtl8188fu/Makefile
      - name: Compile
        run: |
          export PATH="$PWD/toolchain/bin:$PATH" ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out CC=clang exynos7885-a10_defconfig
          make -j$(nproc --all) O=out CC=clang Image
      - name: Zip
        run: |
          git clone --depth=1 https://github.com anykernel
          cp out/arch/arm64/boot/Image anykernel/
          cd anykernel && zip -r9 ../A10-Kernel.zip * -x .git README.md *placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: A10-Kernel
          path: A10-Kernel.zip
