name: Build Neternels A10 with RTL8188FU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Neternels Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2

      - name: Clone Clang Toolchain
        run: |
          git clone --depth=1 https://github.com toolchain

      - name: Inject RTL8188FU Driver (Monitor Mode)
        run: |
          git clone --depth=1 https://github.com drivers/net/wireless/rtl8188fu
          echo 'obj-$(CONFIG_RTL8188FU) += rtl8188fu/' >> drivers/net/wireless/Makefile
          sed -i '/endif/i source "drivers/net/wireless/rtl8188fu/Kconfig"' drivers/net/wireless/Kconfig
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' drivers/net/wireless/rtl8188fu/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_RPI = n/CONFIG_PLATFORM_ARM_RPI = y/g' drivers/net/wireless/rtl8188fu/Makefile

      - name: Compile Kernel Image
        run: |
          export PATH="$PWD/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out CC=clang exynos7885-a10_defconfig
          make -j$(nproc --all) O=out CC=clang Image

      - name: Package Flashable Zip
        run: |
          git clone --depth=1 https://github.com anykernel
          cp out/arch/arm64/boot/Image anykernel/
          cd anykernel && zip -r9 ../Neternels-A10-RTL8188FU.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neternels-A10-RTL8188FU
          path: Neternels-A10-RTL8188FU.zip
